<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)" />

  <!-- Manga Page Container -->
  <g filter="url(#shadow)">
    <rect x="96" y="80" width="320" height="352" rx="20" fill="#FFFFFF" />

    <!-- Top Manga Panel -->
    <rect x="116" y="100" width="280" height="96" rx="8" fill="#F1F5F9" stroke="#1E293B" stroke-width="6" />
    <!-- Character silhouette / manga art abstract -->
    <circle cx="210" cy="148" r="28" fill="#94A3B8" />
    <path d="M190 178 C190 160, 230 160, 230 178 Z" fill="#64748B" />
    <!-- Speech bubble -->
    <ellipse cx="320" cy="144" rx="36" ry="22" fill="#FFFFFF" stroke="#334155" stroke-width="4" />
    <polygon points="296,156 288,168 308,162" fill="#FFFFFF" stroke="#334155" stroke-width="3" />

    <!-- Dashed Gutter Cut Indicator -->
    <line x1="96" y1="216" x2="416" y2="216" stroke="#EF4444" stroke-width="5" stroke-dasharray="10 8" />

    <!-- Bottom Manga Panel -->
    <rect x="116" y="236" width="280" height="176" rx="8" fill="#F8FAFC" stroke="#1E293B" stroke-width="6" />
    <!-- Landscape / manga lines abstract -->
    <path d="M118 360 L180 300 L240 340 L310 280 L394 360 Z" fill="#CBD5E1" />
  </g>

  <!-- Cutting Scissors Icon Floating -->
  <g filter="url(#shadow)" transform="translate(320, 180) rotate(-20) scale(1.15)">
    <!-- Scissor blades -->
    <path d="M-40 0 L60 -15 L20 0 Z" fill="#E2E8F0" stroke="#475569" stroke-width="3" />
    <path d="M-40 0 L60 15 L20 0 Z" fill="#F1F5F9" stroke="#475569" stroke-width="3" />
    <!-- Pivot bolt -->
    <circle cx="0" cy="0" r="7" fill="#0F172A" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    <!-- Handles -->
    <circle cx="-50" cy="-28" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
    <circle cx="-50" cy="28" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
  </g>
</svg>
